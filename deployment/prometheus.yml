# Prometheus configuration for Manufacturing Quality Oracle

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'quality-oracle'
    static_configs:
      - targets: ['quality-oracle:9090']
        labels:
          instance: 'main-application'

  - job_name: 'quality-oracle-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['quality-oracle:8080']
        labels:
          instance: 'api-server'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'alerts.yml'
