version: '3.8'

services:
  quality-oracle:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: quality-oracle-app
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      - postgres
      - redis
      - mongodb
    restart: unless-stopped
    networks:
      - quality-network

  quality-oracle-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: gpu
    container_name: quality-oracle-gpu
    runtime: nvidia
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "8081:8080"
      - "9091:9090"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      - postgres
      - redis
      - mongodb
    restart: unless-stopped
    networks:
      - quality-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: postgres:15-alpine
    container_name: quality-oracle-db
    environment:
      POSTGRES_DB: ${DB_NAME:-quality_oracle}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - quality-network

  redis:
    image: redis:7-alpine
    container_name: quality-oracle-cache
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - quality-network

  mongodb:
    image: mongo:6
    container_name: quality-oracle-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - quality-network

  grafana:
    image: grafana/grafana:latest
    container_name: quality-oracle-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - quality-network

  prometheus:
    image: prom/prometheus:latest
    container_name: quality-oracle-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - quality-network

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  grafana-data:
  prometheus-data:

networks:
  quality-network:
    driver: bridge
